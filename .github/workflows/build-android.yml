name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.json
      - package.json
      - package-lock.json
      - src/**
      - assets/**
      - plugins/**
      - .github/workflows/build-android.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
      EXPO_PUBLIC_INTERNAL_SERVICE_KEY: ${{ secrets.EXPO_PUBLIC_INTERNAL_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duasaku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DuaSaku APK (${{ github.sha }})
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
