name: Build Android APK/AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Build profile
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.profile || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS project
        run: eas build:configure --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building profile: $PROFILE"
          eas build --profile "$PROFILE" --platform android --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          BUILD_URL=$(eas build:list --profile "$PROFILE" --platform android --limit 1 --json | jq -r '.[0].buildDetailsPageUrl')
          echo "Build URL: $BUILD_URL"
          eas build:wait --id $(eas build:list --profile "$PROFILE" --platform android --limit 1 --json | jq -r '.[0].id')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload artifact (preview APK)
        if: github.event.inputs.profile == 'preview' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: duasaku-preview-apk
          path: |
            **/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  submit:
    name: Submit to Play Store
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Play Store
        run: eas submit --profile production --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
